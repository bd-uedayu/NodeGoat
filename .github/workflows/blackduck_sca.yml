name: Black Duck SCA

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  
jobs:
  blackduck:
    runs-on: ubuntu-latest

    steps:
      ## Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

     ## Set up JDK 17 in runtime environment(WebGoat2023.3 requires Java17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

  ## Analyze by Black Duck  SCA
      - name: Black Duck SCA
        continue-on-error: true
        shell: bash
        run: |
          echo "${GITHUB_REPOSITORY}"   
          bash <(curl -s -L https://detect.blackduck.com/detect12.sh) \
            --blackduck.offline.mode=false \
            --blackduck.url="${{ secrets.BLACKDUCK_URL }}" \
            --blackduck.trust.cert=true \
            --blackduck.api.token="${{ secrets.BLACKDUCK_API_TOKEN }}" \
            --detect.project.name=U_test \
            --detect.project.version.name=NordGoat  \
            --detect.detector.search.depth=99 \
            --detect.source.path="${GITHUB_WORKSPACE}"
