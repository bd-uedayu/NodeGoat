name: Quack Patch

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  
jobs:
  blackduck:
    #runs-on: [self-hosted]
    runs-on: ubuntu-latest

    steps:
      ## Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

     ## Set up JDK 17 in runtime environment(WebGoat2023.3 requires Java17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
    
    ## Build
      ##- name: Build
       ## run: mvn compile
       # #mvn clean install
    
    ## Analyze with Black Duck        
      - name: Quack Patch
        continue-on-error: true
        shell: bash
        run: |
          bash <(curl -s -L https://detect.blackduck.com/detect11.sh) \
            --blackduck.offline.mode=false \
            --blackduck.url="${{ secrets.BLACKDUCK_URL }}" \
            --blackduck.trust.cert=true \
            --blackduck.api.token="${{ secrets.BLACKDUCK_API_TOKEN }}" \
            --detect.blackduck.scan.mode=RAPID \
            --detect.quack.patch.enabled=true \
            --detect.llm.api.endpoint="${{ secrets.LLM_API_ENDPOINT }}" \
            --detect.llm.api.key="${{ secrets.LLM_API_KEY }}" \
            --detect.llm.name=claude-sonnet-4-6 \
            --detect.quack.patch.output.path="${GITHUB_WORKSPACE}/quack-patch"
          echo "=== AFTER DETECT ==="      
          find /home/runner/blackduck -type f
          echo "=== ARTIFACT ==="
          ls -la artifact || true
          find artifact -type f || true
          mkdir -p artifact
          cp -R /home/runner/blackduck/runs/*/scan/quack-patch/* artifact/ || true
      
      - name: Debug Detect Directory
        if: always()
        run: |
            echo "==== RUNS ===="
            find /home/runner/blackduck/runs -ls || true

            echo "==== BLACKDUCK ===="
            find /home/runner/blackduck -ls || true

      - name: Upload Quack Patch Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quack-patch-results
          path: /home/runner/blackduck/runs/**/scan/quack-patch
          ##path: quack-patch

      - name: Upload Quack Patch Results2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quack-patch-results2
          path: artifact
